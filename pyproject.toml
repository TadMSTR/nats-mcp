[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nats-mcp"
version = "0.2.0"
description = "FastMCP server for NATS messaging bus health via the HTTP monitoring API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "nats", "messaging", "monitoring", "fastmcp"]
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=4.0",
    "ruff",
]

[project.scripts]
nats-mcp = "nats_mcp.server:main"

[tool.setuptools.packages.find]
include = ["nats_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.coverage.run]
source = ["nats_mcp"]
# observability.py is IN the gate as of v0.2.0. It was omitted, so the log-sink
# behaviour — which sink, which logger, whether a file is created — was never
# measured at all, and that behaviour is load-bearing for the containerised
# deploy. Only __main__.py stays out: it is a two-line entry point that calls
# main() at import time and needs a live transport to exercise.
omit = ["tests/*", "nats_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
