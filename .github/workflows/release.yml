name: Release

on:
  push:
    tags:
      - "v*"

# Scoped per job rather than at the top level: a workflow-level block would hand
# packages: write to the release job, which has no business pushing images, and
# contents: write to the publish job. Least privilege is nearly free here.
permissions: {}

# No PyPI publish. A tag `vX.Y.Z` cuts a GitHub Release with auto-generated notes
# and publishes the container image to GHCR. The image is the deployment artifact —
# ~/docker/nats/ pulls it by tag (see deploy/docker-compose.nats-mcp.yml).
jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release (source only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            echo "Release ${TAG_NAME} already exists; nothing to do."
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # arm64 is emulated on the amd64 runner. Every compiled dependency in the tree
      # (grpcio, cryptography, pydantic-core, rpds-py, protobuf, cffi) publishes an
      # aarch64 manylinux wheel — checked at build time, 2026-08-30 — so this is a
      # copy, not a compile. If it ever does turn slow or flaky, drop linux/arm64
      # from platforms below rather than carrying the flakiness into a release.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Lowercased owner: GHCR rejects an uppercase path and the owner here is
      # `TadMSTR`. Hardcoded rather than derived, so a mistake shows up as a
      # wrong-looking string in a diff instead of a failed push at tag time.
      #
      # The tag carries the leading `v` verbatim (`:v0.3.0`), which is what
      # deploy/docker-compose.nats-mcp.yml pins.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/tadmstr/nats-mcp:${{ github.ref_name }}
            ghcr.io/tadmstr/nats-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
