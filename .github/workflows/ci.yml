name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # [otel] is not optional for CI. The OTEL success-path tests use
        # importorskip, so a [dev]-only install SKIPS them silently and coverage
        # reports green over code that was never executed — the exact shape of the
        # dead get_tracer() this release fixed.
        run: pip install ".[dev,otel]" ruff==0.16.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=nats_mcp --cov-report=term-missing

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --strict .

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel installs
        run: |
          pip install dist/*.whl
          python -c "import nats_mcp; print('install ok')"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nats-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves the image assembles; it does not prove it runs. Without the
      # steps below, a broken entry point or a missing runtime dependency would first
      # surface at tag time, as a failed release rather than a failed PR.

      - name: Smoke test — refuses to start with no token
        run: |
          set +e
          out=$(docker run --rm nats-mcp:ci 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::HTTP transport started with no NATS_MCP_API_TOKEN — the fail-closed guard is gone"
            exit 1
          fi
          echo "$out" | grep -q "without NATS_MCP_API_TOKEN" || {
            echo "::error::exited non-zero but not for the expected reason"; exit 1; }

      - name: Smoke test — refuses a token under 16 chars
        run: |
          set +e
          out=$(docker run --rm -e NATS_MCP_API_TOKEN=tooshort nats-mcp:ci 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::started with an 8-char token — the minimum-length guard is gone"
            exit 1
          fi
          echo "$out" | grep -q "too short" || {
            echo "::error::exited non-zero but not for the expected reason"; exit 1; }

      - name: Smoke test — the baked non-loopback opt-in is load-bearing
        run: |
          set +e
          out=$(docker run --rm -e NATS_MCP_ALLOW_NONLOOPBACK= \
            -e NATS_MCP_API_TOKEN=0123456789abcdef0123456789abcdef nats-mcp:ci 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::started on 0.0.0.0 without the opt-in — the guard is gone"
            exit 1
          fi
          echo "$out" | grep -q "non-loopback host" || {
            echo "::error::exited non-zero but not for the expected reason"; exit 1; }

      - name: Smoke test — healthy, /health unauthenticated, /mcp still 401
        run: |
          # No NATS anywhere in CI, and the container must still go healthy: /health is
          # liveness, not readiness. If this step ever needs a NATS service to pass, the
          # probe has started reaching upstream and the restart-loop risk is back.
          docker run -d --name nats-mcp-ci -p 127.0.0.1:8508:8508 \
            -e NATS_MCP_API_TOKEN=0123456789abcdef0123456789abcdef nats-mcp:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' nats-mcp-ci)" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' nats-mcp-ci | grep -qx healthy || {
            echo "::error::container never became healthy"; docker logs nats-mcp-ci; exit 1; }

          # No Authorization header at all.
          body=$(curl -fsS http://127.0.0.1:8508/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # `if grep` rather than `grep && exit 1`: the latter returns non-zero from the
          # compound when grep finds nothing, failing the step on the success path.
          if echo "$body" | grep -qiE "8222|0\.0\.0\.0|token|version"; then
            echo "::error::/health echoed config — it is unauthenticated by design"
            exit 1
          fi

          # The exemption must be exact-path. A startswith("/health") implementation
          # passes the check above and fails here.
          for p in /healthz /health/ /health-debug /mcp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8508$p")
            [ "$code" = "401" ] || {
              echo "::error::$p returned $code, expected 401 — auth exemption is too broad"
              docker rm -f nats-mcp-ci; exit 1; }
            echo "$p -> 401"
          done
          docker rm -f nats-mcp-ci

      - name: Verify the image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id nats-mcp:ci -u)
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid $uid"
